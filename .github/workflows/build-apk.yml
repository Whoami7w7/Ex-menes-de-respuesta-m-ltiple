name: Build Avance G-N APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Avance_GN_Android_Proyecto_v17_RAIZ.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

                        - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -o Avance_GN_Android_Proyecto_v17_RAIZ.zip -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Avance-GN-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
