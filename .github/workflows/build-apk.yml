name: Build Avance G-N APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Avance_GN_Android_Proyecto_v17_RAIZ.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto ZIP
        run: |
          mkdir -p proyecto
          unzip -o Avance_GN_Android_Proyecto_v17_RAIZ.zip -d proyecto
          echo "Contenido extraído:"
          find proyecto -maxdepth 4 -type f | head -100

      - name: Localizar Gradle
        run: |
          GRADLEW=$(find proyecto -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew en el ZIP."
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLE_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Avance-GN-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
